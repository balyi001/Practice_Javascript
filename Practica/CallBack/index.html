<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio de Promedio</title>
</head>
<body>

    <div class="contenedor-calculo">
        <h2>Calculadora de Promedio</h2>
        
        <input type="number" id="num1" placeholder="Número 1">
        <input type="number" id="num2" placeholder="Número 2">
        <input type="number" id="num3" placeholder="Número 3">
        
        <button id="btnCalcular">Calcular Promedio</button>

        <div id="resultado">
            <p>Suma: <span id="txtSuma">-</span></p>
            <p>Promedio: <span id="txtPromedio">-</span></p>
        </div>
    </div>

    <script src="Js/script.js"></script>
</body>
</html>
