<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Estudiantes</title>
    <link rel="stylesheet" href="Style/style.css">
</head>
<body>

    <h2>Registro de la Academia</h2>
    
    <div>
        <input type="hidden" id="idEstudiante"> <label>Nombre:</label>
        <input type="text" id="nombre" placeholder="Ej: Carlos">
        
        <label>Correo:</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com">
        
        <label>Fecha de Nacimiento:</label>
        <input type="date" id="fechaNacimiento">
        
        <button id="btnGuardar" onclick="guardarEstudiante()">Guardar Estudiante</button>
    </div>

    <hr>

    <h3>Lista de Estudiantes Registrados</h3>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Fecha de Nacimiento</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaCuerpo">
            </tbody>
    </table>

    <script src="Js/script.js"></script>
</body>
</html>
